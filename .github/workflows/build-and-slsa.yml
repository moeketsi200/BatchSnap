name: Node.js Build & SLSA3 Provenance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Webpack / Next.js Build
    runs-on: ubuntu-latest
    outputs:
      artifact-hashes: ${{ steps.hash.outputs.hashes }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build Application (Webpack)
        working-directory: ./web
        run: npm run build

      - name: Archive build artifacts
        working-directory: ./web
        run: tar -czf ../batchsnap-release.tar.gz .next public package.json

      - name: Generate subject hashes for SLSA
        id: hash
        run: |
          # SLSA requires base64 encoded sha256 hashes of the artifacts
          HASHES=$(sha256sum batchsnap-release.tar.gz | base64 -w0)
          echo "hashes=$HASHES" >> $GITHUB_OUTPUT

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: batchsnap-release
          path: batchsnap-release.tar.gz
          if-no-files-found: error

  generate-slsa-provenance:
    needs: build
    name: Generate SLSA3 Provenance
    permissions:
      actions: read
      id-token: write
      contents: write
    # The official OpenSSF Generic SLSA Generator
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.artifact-hashes }}"
      upload-assets: true
